# Full stack for a local production-like run: `docker compose up --build`, then open http://localhost:8080
# Copy .env.example to .env first and set the secrets.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fixlocal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: fixlocal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixlocal -d fixlocal"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Opt-in nightly backup of the database and uploaded files: `docker compose --profile backup up -d`.
  # Files land in BACKUP_PATH (default: the db_backups volume). Set BACKUP_PATH to a mounted network disk,
  # or copy the files off this host (S3, another server): a backup on the same disk dies with it.
  # A failed run is reported to ERROR_WEBHOOK_URL when set.
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGUSER: fixlocal
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PGDATABASE: fixlocal
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        alert() {
          echo "backup FAILED: $$1" >&2
          [ -n "$$ERROR_WEBHOOK_URL" ] && wget -q -O /dev/null --header="Content-Type: application/json" \
            --post-data="{\"text\":\"FixLocal backup failed: $$1\"}" "$$ERROR_WEBHOOK_URL" || true
        }
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          rm -f /backups/*.tmp
          f=/backups/fixlocal-$$stamp.dump
          if pg_dump --format=custom --no-owner --file="$$f.tmp" && mv "$$f.tmp" "$$f"; then echo "backup ok $$f"; else alert "database dump"; fi
          u=/backups/uploads-$$stamp.tar.gz
          if tar -czf "$$u.tmp" -C /uploads . && mv "$$u.tmp" "$$u"; then echo "backup ok $$u"; else alert "uploads archive"; fi
          rm -f /backups/*.tmp
          # Minutes, not days: find -mtime +N would keep N+1 days.
          find /backups \( -name 'fixlocal-*.dump' -o -name 'uploads-*.tar.gz' \) -mmin +$$((BACKUP_KEEP_DAYS * 1440)) -delete
          sleep 86400
        done
    volumes:
      - ${BACKUP_PATH:-db_backups}:/backups
      - uploads:/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: fixlocal
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: fixlocal
      MIGRATIONS_RUN: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters)}
      FILE_URL_SECRET: ${FILE_URL_SECRET:?Set FILE_URL_SECRET in .env (32+ random characters)}
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /app/uploads
      # Uploads: local (the uploads volume) or s3 (any S3-compatible bucket; needed for several API instances).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PREFIX: ${S3_PREFIX:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${APP_URL:-http://localhost:8080}
      # Set to true when the site is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Number of proxies in front of the API: 1 = just this nginx; 2 = an outer TLS proxy/load balancer + nginx.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOG_LEVEL: info
      # Email: smtp in real deployments (SMTP_URL=smtps://user:pass@smtp.example.com:465).
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-FixLocal <no-reply@fixlocal.local>}
      ALLOW_CONSOLE_MAIL: ${ALLOW_CONSOLE_MAIL:-false}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
        VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-}
        # Falls back to APP_URL so canonical/Open Graph/sitemap URLs never point at a placeholder domain.
        VITE_SITE_URL: ${VITE_SITE_URL:-${APP_URL:-http://localhost:8080}}
        VITE_LEGAL_ENTITY: ${VITE_LEGAL_ENTITY:-}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        VITE_GRIEVANCE_OFFICER: ${VITE_GRIEVANCE_OFFICER:-}
        VITE_GRIEVANCE_EMAIL: ${VITE_GRIEVANCE_EMAIL:-}
    ports:
      # Only this machine can reach it by default; the TLS proxy in front connects locally.
      # Set WEB_BIND=0.0.0.0 to expose it on the network directly.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  db_backups:
