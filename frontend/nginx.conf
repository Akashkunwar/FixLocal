# Serves the built app and proxies the API on the same origin (so the refresh cookie just works).

# Compress text responses (the React vendor chunk is ~260 KB raw). Server-sent events are not listed.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/css text/plain text/xml application/javascript application/json application/xml
  application/manifest+json image/svg+xml;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Docker's DNS: look the api container up again every 10s, so restarting or rescaling it
  # doesn't leave nginx pointing at an old address. proxy_pass uses this variable for that reason.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3001;

  # Largest upload request: 8 photos × 5 MB plus form fields.
  client_max_body_size 45m;

  location ^~ /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    # Live updates (server-sent events) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Pro meta tags, fetched only by the SSI include on /pros/:id below. If the API is down, slow
  # or rate-limiting, nginx swaps in a plain default head instead of pasting the error into <head>.
  location ^~ /_seo/pros/ {
    internal;
    rewrite ^/_seo/pros/(.*)$ /api/seo/pros/$1 break;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 400 401 403 405 408 429 500 502 503 504 = /_seo/default-head;
  }

  location = /_seo/default-head {
    internal;
    default_type text/html;
    return 200 '<title>Professional on FixLocal</title>\n<meta name="description" content="See this professional\'s work, reviews and services on FixLocal." />\n';
  }

  location = /sitemap-pros.xml {
    rewrite ^ /api/seo/sitemap-pros.xml break;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Public pro profiles: the app shell with the pro's own title, description, Open Graph and JSON-LD
  # inlined into <head> by nginx (SSI), so crawlers and link previews see them without running JavaScript.
  location ~ "^/pros/(?<pro_id>[0-9a-fA-F-]{36})/?$" {
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files /pro.html =404;
  }

  location ^~ /uploads/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /health {
    proxy_pass $api;
  }

  # Hashed build files never change.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # The service worker and the app shell must always be revalidated.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # A missing file (old script, typo'd image) is a real 404, not the app shell with status 200.
  location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|txt|xml|json|webmanifest)$ {
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}

# Keep the original https scheme when an outer TLS proxy sits in front of this container.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}
