# Serves the built app and proxies the API on the same origin (so the refresh cookie just works).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Largest upload request: 8 photos × 5 MB plus form fields.
  client_max_body_size 45m;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Live updates (server-sent events) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Pro meta tags for the SSI include below: a normal buffered proxy (the /api/ block streams SSE unbuffered).
  location ^~ /api/seo/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sitemap-pros.xml {
    proxy_pass http://api:3001/api/seo/sitemap-pros.xml;
    proxy_set_header Host $host;
  }

  # Public pro profiles: the app shell with the pro's own title, description, Open Graph and JSON-LD
  # inlined into <head> by nginx (SSI), so crawlers and link previews see them without running JavaScript.
  location ~ "^/pros/(?<pro_id>[0-9a-fA-F-]{36})/?$" {
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files /pro.html =404;
  }

  location /uploads/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    proxy_pass http://api:3001;
  }

  # Hashed build files never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker and the app shell must always be revalidated.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
