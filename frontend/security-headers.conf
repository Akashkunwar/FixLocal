# Shared by the HTML locations in nginx.conf (add_header is not inherited once a location sets its own).
add_header X-Content-Type-Options "nosniff";
add_header Referrer-Policy "strict-origin-when-cross-origin";
# No framing (clickjacking on "Accept & hire" / "Release" buttons), no third-party scripts.
# img-src allows https: so a production map tile provider (VITE_MAP_TILE_URL) works without editing this file.
add_header X-Frame-Options "DENY";
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()";
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
# Browsers only honour this over HTTPS (the outer TLS proxy); it is ignored on plain-HTTP local runs.
add_header Strict-Transport-Security "max-age=31536000" always;
